plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing is driven by a keystore.properties next to this file's project root.
// It is gitignored, so a clone without one still builds -- the release APK just comes out
// unsigned, exactly as it did before. Create it from keystore.properties.example.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'io.github.kunelab.kontroller'
    compileSdk 36

    defaultConfig {
        applicationId "io.github.kunelab.kontroller"
        minSdk 28
        targetSdk 36
        // versionCode must increase for every published build or Android refuses the
        // upgrade. versionName is what users see and should match the release tag.
        versionCode 7
        versionName "0.3.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            if (keystoreProperties.containsKey('storeFile')) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
            // v1 (JAR signing) is only needed below API 24 and minSdk is 28.
            // v3 carries the proof-of-rotation record, so the signing key can be rotated
            // later without orphaning everyone's installed copy -- worth having from the
            // first release, because it cannot be added retroactively.
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            // Without this the 21 locales and the unused launcher/action-bar drawables are
            // all packaged even when nothing references them.
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProperties.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        // MissingTranslation is an error by default, which meant `assembleRelease` could
        // not complete: app_name, action_check and action_check_held have never been
        // translated in any of the 20 non-English locales, and every string added from here
        // on starts out untranslated too. An untranslated string falls back to English,
        // which is a cosmetic gap, not a broken build -- so it is reported and not fatal.
        warning 'MissingTranslation'

        // Deliberate: the trackpad and the click buttons are driven from the raw touch
        // stream because a HID button has to be able to stay held down across a drag.
        // The click buttons do call performClick(); the pad itself has no click semantics.
        disable 'ClickableViewAccessibility'

        abortOnError true
    }

    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

// No third-party dependencies: the app runs entirely on framework APIs.
// Anko (archived), kotlin-android-extensions (removed in Kotlin 1.8),
// kotpref (never referenced) and the support-library LocalBroadcastManager
// (only ever used in commented-out code) were all dropped.
dependencies {
}

// Stages one release into /release, which is gitignored and holds nothing durable.
//
// The directory is wiped on every run, which is the reason this is a task and not a few
// manual copies: the previous version's APK sitting next to the new one is the mistake that
// gets the wrong file uploaded. The lasting record of a release is the fastlane changelog
// under fastlane/metadata/android/<locale>/changelogs/<versionCode>.txt, which is tracked.
tasks.register('stageRelease') {
    group = 'publishing'
    description = 'Wipes /release, then stages the release APK and its SHA-256 for upload.'
    dependsOn 'assembleRelease'

    def apkDir = layout.buildDirectory.dir('outputs/apk/release')
    def stagingDir = rootProject.layout.projectDirectory.dir('release').asFile
    def versionName = android.defaultConfig.versionName
    // Without a keystore.properties the release build is still produced, just unsigned, and
    // AGP names it differently. Staging it anyway (clearly marked) beats failing here.
    def signed = keystoreProperties.containsKey('storeFile')

    doLast {
        def apk = apkDir.get().file(signed ? 'app-release.apk' : 'app-release-unsigned.apk').asFile
        if (!apk.exists()) {
            throw new GradleException("assembleRelease produced no APK at ${apk}")
        }

        stagingDir.deleteDir()
        stagingDir.mkdirs()

        def name = "KuneLabKontroller-${versionName}${signed ? '' : '-unsigned'}.apk"
        def staged = new File(stagingDir, name)
        staged.bytes = apk.bytes

        // sha256sum -b format, so `sha256sum -c <file>.sha256` verifies it as-is.
        def hex = java.security.MessageDigest.getInstance('SHA-256')
                .digest(staged.bytes)
                .encodeHex()
                .toString()
        new File(stagingDir, "${name}.sha256").text = "${hex} *${name}\n"

        logger.lifecycle("Staged release/${name} (${staged.length()} bytes)")
        logger.lifecycle("sha256  ${hex}")
        if (!signed) {
            logger.warn('WARNING: no keystore.properties, so the staged APK is UNSIGNED.')
        }
    }
}
