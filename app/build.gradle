plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.github.roarappstudio.btkontroller'
    compileSdk 36

    defaultConfig {
        applicationId "com.github.roarappstudio.btkontroller"
        minSdk 28
        targetSdk 36
        versionCode 3
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

// No third-party dependencies: the app runs entirely on framework APIs.
// Anko (archived), kotlin-android-extensions (removed in Kotlin 1.8),
// kotpref (never referenced) and the support-library LocalBroadcastManager
// (only ever used in commented-out code) were all dropped.
dependencies {
}
