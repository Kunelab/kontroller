plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing is driven by a keystore.properties next to this file's project root.
// It is gitignored, so a clone without one still builds -- the release APK just comes out
// unsigned, exactly as it did before. Create it from keystore.properties.example.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.github.roarappstudio.btkontroller'
    compileSdk 36

    defaultConfig {
        applicationId "com.github.roarappstudio.btkontroller"
        minSdk 28
        targetSdk 36
        versionCode 3
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            if (keystoreProperties.containsKey('storeFile')) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            // Without this the 22 locales and the unused launcher/action-bar drawables are
            // all packaged even when nothing references them.
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProperties.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        // MissingTranslation is an error by default, which meant `assembleRelease` could
        // not complete: app_name, action_check and action_check_held have never been
        // translated in any of the 21 locales, and every string added from here on starts
        // out untranslated too. An untranslated string falls back to English, which is a
        // cosmetic gap, not a broken build -- so it is reported and not fatal.
        warning 'MissingTranslation'

        // Deliberate: the trackpad and the click buttons are driven from the raw touch
        // stream because a HID button has to be able to stay held down across a drag.
        // The click buttons do call performClick(); the pad itself has no click semantics.
        disable 'ClickableViewAccessibility'

        abortOnError true
    }

    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

// No third-party dependencies: the app runs entirely on framework APIs.
// Anko (archived), kotlin-android-extensions (removed in Kotlin 1.8),
// kotpref (never referenced) and the support-library LocalBroadcastManager
// (only ever used in commented-out code) were all dropped.
dependencies {
}
